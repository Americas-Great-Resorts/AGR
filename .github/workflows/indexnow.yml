name: Submit changed pages to IndexNow

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow-submission
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and submit public URLs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          base_url="https://americas-great-resorts.github.io/AGR/"
          sitemap_url="${base_url}sitemap.xml"
          host="americas-great-resorts.github.io"
          key="ad7d46bf8ad94f558eff61d6a28cd586"
          key_location="${base_url}${key}.txt"
          event_name="${{ github.event_name }}"

          declare -A unique_urls=()

          if [ "$event_name" = "workflow_dispatch" ]; then
            sitemap_file="$(mktemp)"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --output "$sitemap_file" \
              "$sitemap_url"

            while IFS= read -r url; do
              case "$url" in
                ""|*/google*.html)
                  continue
                  ;;
              esac
              unique_urls["$url"]=1
            done < <(
              grep -o '<loc>[^<]*</loc>' "$sitemap_file" |
                sed 's#<loc>##; s#</loc>##'
            )
          else
            previous_commit="$(
              gh run list \
                --repo "${{ github.repository }}" \
                --workflow indexnow.yml \
                --status success \
                --limit 1 \
                --json headSha \
                --jq '.[0].headSha // empty' 2>/dev/null || true
            )"

            if [ -z "$previous_commit" ] || ! git merge-base --is-ancestor "$previous_commit" HEAD 2>/dev/null; then
              previous_commit="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi

            if [ -z "$previous_commit" ]; then
              echo "No previous commit is available for comparison."
              exit 0
            fi

            if [ "$previous_commit" = "$(git rev-parse HEAD)" ]; then
              echo "No new commits since the last successful submission."
              exit 0
            fi

            echo "Comparing $previous_commit to $(git rev-parse HEAD)"

            while IFS= read -r -d '' file; do
              case "$file" in
                .github/*|_*|README.md|google*.html)
                  continue
                  ;;
                */index.md)
                  url="${base_url}${file%index.md}"
                  ;;
                index.md)
                  url="${base_url}"
                  ;;
                *.md)
                  url="${base_url}${file%.md}.html"
                  ;;
                *.html|*.pdf)
                  url="${base_url}${file}"
                  ;;
                *)
                  continue
                  ;;
              esac

              unique_urls["$url"]=1
            done < <(
              git diff --name-only --diff-filter=ACDMRT -z \
                "$previous_commit" HEAD -- '*.md' '*.html' '*.pdf'
            )
          fi

          if [ "${#unique_urls[@]}" -eq 0 ]; then
            echo "No public pages require submission."
            exit 0
          fi

          mapfile -t urls < <(printf '%s\n' "${!unique_urls[@]}" | sort)

          if [ "${#urls[@]}" -gt 10000 ]; then
            echo "Submission exceeds IndexNow's 10,000-URL limit."
            exit 1
          fi

          printf 'Submitting %s URL(s):\n' "${#urls[@]}"
          printf '%s\n' "${urls[@]}"

          url_list_json="$(
            printf '%s\n' "${urls[@]}" |
              jq -R . |
              jq -s .
          )"

          payload="$(
            jq -n \
              --arg host "$host" \
              --arg key "$key" \
              --arg keyLocation "$key_location" \
              --argjson urlList "$url_list_json" \
              '{
                host: $host,
                key: $key,
                keyLocation: $keyLocation,
                urlList: $urlList
              }'
          )"

          http_code="$(
            curl \
              --silent \
              --show-error \
              --output indexnow-response.txt \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json; charset=utf-8' \
              --data "$payload" \
              'https://www.bing.com/indexnow'
          )"

          echo "IndexNow HTTP response: $http_code"

          if [ -s indexnow-response.txt ]; then
            cat indexnow-response.txt
          fi

          case "$http_code" in
            200)
              echo "IndexNow accepted the submission."
              ;;
            202)
              echo "IndexNow received the submission; key validation is pending."
              ;;
            *)
              echo "IndexNow rejected the submission."
              exit 1
              ;;
          esac
