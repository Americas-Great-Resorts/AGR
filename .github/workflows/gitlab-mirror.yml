name: Mirror to GitLab

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main branch and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/americas-great-resorts1/AGR.git"
          git fetch origin main --tags --force
          git push --force gitlab refs/remotes/origin/main:refs/heads/main
          git push --force gitlab --tags
